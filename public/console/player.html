<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Console</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game { width: 100%; height: 100%; }
    /* Our own PT-BR toolbar lives in the host window; hide EmulatorJS' bar and context menu. */
    .ejs_menu_bar, .ejs_context_menu, .ejs_virtualGamepad_parent { display: none !important; }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #audio-unlock {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 99999;
    }
    #audio-unlock button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #ec4899, #f43f5e);
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="audio-unlock"><button type="button">🔊 Clique para ativar o som</button></div>
  <script src="./player.js"></script>
</body>
</html>
