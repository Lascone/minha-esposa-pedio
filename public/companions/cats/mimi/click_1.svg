<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="mimiFur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffeef2"/>
      <stop offset="100%" stop-color="#ffd6e0"/>
    </radialGradient>
  </defs>

  <!-- Love Hearts floating! -->
  <path d="M 22 22 A 4 4 0 0 0 14 26 Q 14 32 22 38 Q 30 32 30 26 A 4 4 0 0 0 22 22 Z" fill="#ff4d6d" transform="rotate(-15 22 27)"/>
  <path d="M 76 18 A 5 5 0 0 0 66 23 Q 66 30 76 37 Q 86 30 86 23 A 5 5 0 0 0 76 18 Z" fill="#ff758f" transform="rotate(15 76 24)"/>

  <!-- Body sitting -->
  <ellipse cx="50" cy="64" rx="24" ry="20" fill="url(#mimiFur)"/>
  
  <!-- Paw pads raised -->
  <ellipse cx="38" cy="78" rx="6" ry="5" fill="#ffffff"/>
  <circle cx="38" cy="78" r="2.5" fill="#ff758f"/>
  <ellipse cx="62" cy="78" rx="6" ry="5" fill="#ffffff"/>
  <circle cx="62" cy="78" r="2.5" fill="#ff758f"/>

  <!-- Head -->
  <ellipse cx="50" cy="38" rx="24" ry="20" fill="url(#mimiFur)"/>

  <!-- Ears -->
  <polygon points="28,20 18,36 38,32" fill="url(#mimiFur)"/>
  <polygon points="28,23 21,34 35,31" fill="#ffccd5"/>
  <polygon points="72,20 82,36 62,32" fill="url(#mimiFur)"/>
  <polygon points="72,23 79,34 65,31" fill="#ffccd5"/>

  <!-- Happy Purring Closed Eyes -->
  <path d="M 36 38 Q 41 32 46 38" fill="none" stroke="#4a3b5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 54 38 Q 59 32 64 38" fill="none" stroke="#4a3b5c" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="32" cy="44" rx="5" ry="3" fill="#ff4d6d" opacity="0.6"/>
  <ellipse cx="68" cy="44" rx="5" ry="3" fill="#ff4d6d" opacity="0.6"/>

  <!-- Whiskers -->
  <path d="M 24 43 L 14 41" stroke="#ffb3c6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 24 47 L 15 49" stroke="#ffb3c6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 76 43 L 86 41" stroke="#ffb3c6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 76 47 L 85 49" stroke="#ffb3c6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Happy Cat Mouth with Tongue -->
  <path d="M 46 45 Q 50 51 54 45" fill="#ff758f" stroke="#4a3b5c" stroke-width="1.5"/>
</svg>
