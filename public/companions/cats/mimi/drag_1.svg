<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="mimiFur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffeef2"/>
      <stop offset="100%" stop-color="#ffd6e0"/>
    </radialGradient>
  </defs>

  <!-- Dangling kitten lifted by nape -->
  <!-- Tail hanging down with flower -->
  <path d="M 48 76 Q 44 90 40 96" fill="none" stroke="url(#mimiFur)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="96" r="4" fill="#ffb3c6"/>

  <!-- Body stretched -->
  <ellipse cx="50" cy="58" rx="20" ry="24" fill="url(#mimiFur)"/>

  <!-- Dangling Front Paws with pink paw pads -->
  <ellipse cx="34" cy="66" rx="5" ry="7" fill="#ffffff"/>
  <circle cx="34" cy="70" r="2.5" fill="#ff758f"/>
  <ellipse cx="66" cy="66" rx="5" ry="7" fill="#ffffff"/>
  <circle cx="66" cy="70" r="2.5" fill="#ff758f"/>

  <!-- Dangling Back Paws -->
  <ellipse cx="40" cy="82" rx="4.5" ry="6" fill="#ffffff"/>
  <circle cx="40" cy="85" r="2" fill="#ff758f"/>
  <ellipse cx="60" cy="82" rx="4.5" ry="6" fill="#ffffff"/>
  <circle cx="60" cy="85" r="2" fill="#ff758f"/>

  <!-- Head -->
  <ellipse cx="50" cy="30" rx="20" ry="16" fill="url(#mimiFur)"/>

  <!-- Ears -->
  <polygon points="32,12 24,30 42,26" fill="url(#mimiFur)"/>
  <polygon points="32,15 26,28 39,25" fill="#ffccd5"/>
  <polygon points="68,12 76,30 58,26" fill="url(#mimiFur)"/>
  <polygon points="68,15 74,28 61,25" fill="#ffccd5"/>

  <!-- Big surprised kitten eyes -->
  <ellipse cx="42" cy="28" rx="4.5" ry="5.5" fill="#4a3b5c"/>
  <circle cx="40.5" cy="26" r="2" fill="#ffffff"/>
  <ellipse cx="58" cy="28" rx="4.5" ry="5.5" fill="#4a3b5c"/>
  <circle cx="56.5" cy="26" r="2" fill="#ffffff"/>

  <!-- Whiskers -->
  <path d="M 28 32 L 18 30" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 28 35 L 19 37" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 72 32 L 82 30" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 72 35 L 81 37" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cute 'O' mouth -->
  <ellipse cx="50" cy="36" rx="2" ry="2.5" fill="#ff758f"/>
