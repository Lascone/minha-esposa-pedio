<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="mimiFur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffeef2"/>
      <stop offset="100%" stop-color="#ffd6e0"/>
    </radialGradient>
  </defs>

  <!-- Sleeping Cat Loaf -->
  <ellipse cx="50" cy="65" rx="36" ry="24" fill="url(#mimiFur)"/>
  
  <!-- Curled Tail with Sakura flower at tip -->
  <path d="M 80 65 Q 88 50 78 46 Q 72 52 78 65" fill="url(#mimiFur)"/>
  <circle cx="78" cy="48" r="4" fill="#ffb3c6"/>
  <circle cx="78" cy="48" r="1.5" fill="#ffd166"/>

  <!-- Tucked Paws with pink beans -->
  <ellipse cx="32" cy="76" rx="5" ry="3.5" fill="#ffffff"/>
  <ellipse cx="42" cy="76" rx="5" ry="3.5" fill="#ffffff"/>

  <!-- Head -->
  <ellipse cx="34" cy="54" rx="20" ry="16" fill="url(#mimiFur)"/>

  <!-- Cute Cat Ears -->
  <polygon points="22,44 16,28 30,36" fill="url(#mimiFur)"/>
  <polygon points="22,42 18,31 28,37" fill="#ffccd5"/>
  <polygon points="44,42 54,28 48,40" fill="url(#mimiFur)"/>
  <polygon points="45,41 51,31 47,39" fill="#ffccd5"/>

  <!-- Sleeping Eyes -->
  <path d="M 24 54 Q 28 58 32 54" fill="none" stroke="#6b4c6e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose & Whiskers -->
  <ellipse cx="26" cy="60" rx="1.8" ry="1.2" fill="#ff758f"/>
  <path d="M 18 58 L 10 57" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 18 61 L 11 63" stroke="#ffb3c6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="32" cy="60" rx="4" ry="2" fill="#ff4d6d" opacity="0.4"/>

  <!-- Floating zZz -->
  <text x="64" y="44" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#ff758f">z</text>
  <text x="72" y="32" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ff4d6d">Z</text>
  <text x="82" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#e63946">Z</text>
</svg>
