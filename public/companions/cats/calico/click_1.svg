<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="calicoWhite" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>

  <!-- Love Hearts -->
  <path d="M 20 22 A 4 4 0 0 0 12 26 Q 12 32 20 38 Q 28 32 28 26 A 4 4 0 0 0 20 22 Z" fill="#ea580c" transform="rotate(-15 20 27)"/>
  <path d="M 76 18 A 5 5 0 0 0 66 23 Q 66 30 76 37 Q 86 30 86 23 A 5 5 0 0 0 76 18 Z" fill="#f43f5e" transform="rotate(15 76 24)"/>

  <!-- Body -->
  <ellipse cx="48" cy="64" rx="22" ry="18" fill="url(#calicoWhite)"/>
  <path d="M 32 54 Q 44 48 38 68 Z" fill="#ea580c"/>
  <path d="M 52 56 Q 66 52 62 70 Z" fill="#1e293b"/>

  <ellipse cx="36" cy="80" rx="5" ry="4" fill="#ffffff"/>
  <ellipse cx="60" cy="80" rx="5" ry="4" fill="#ffffff"/>

  <!-- Ears -->
  <polygon points="34,18 24,34 42,30" fill="#ea580c"/>
  <polygon points="68,18 76,34 58,30" fill="#1e293b"/>

  <!-- Head -->
  <ellipse cx="50" cy="36" rx="20" ry="17" fill="url(#calicoWhite)"/>
  <path d="M 32 28 Q 44 26 40 40 Z" fill="#ea580c"/>

  <!-- Happy Cat Eyes (Arcs) -->
  <path d="M 38 34 Q 42 29 46 34" fill="none" stroke="#052e16" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 54 34 Q 58 29 62 34" fill="none" stroke="#052e16" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="32" cy="40" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="68" cy="40" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.6"/>

  <!-- Open happy meowing mouth with tongue -->
  <path d="M 46 41 Q 50 48 54 41" fill="#f43f5e" stroke="#1e293b" stroke-width="1.2"/>
</svg>
