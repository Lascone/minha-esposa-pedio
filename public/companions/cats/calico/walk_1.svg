<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="calicoWhite" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>

  <!-- Tail up in walk -->
  <path d="M 22 52 Q 12 36 22 30 Q 30 36 24 50" fill="#ea580c"/>
  <circle cx="19" cy="32" r="4" fill="#1e293b"/>

  <!-- Body -->
  <ellipse cx="48" cy="62" rx="22" ry="17" fill="url(#calicoWhite)"/>
  <path d="M 32 52 Q 44 46 38 66 Z" fill="#ea580c"/>
  <path d="M 52 54 Q 66 50 62 68 Z" fill="#1e293b"/>

  <!-- Paws walk -->
  <ellipse cx="34" cy="78" rx="6" ry="4" fill="#ffffff" transform="rotate(-15 34 78)"/>
  <ellipse cx="62" cy="76" rx="5" ry="3.5" fill="#ffffff" transform="rotate(15 62 76)"/>

  <!-- Ears -->
  <polygon points="34,16 24,32 42,28" fill="#ea580c"/>
  <polygon points="68,16 76,32 58,28" fill="#1e293b"/>

  <!-- Head -->
  <ellipse cx="50" cy="34" rx="20" ry="17" fill="url(#calicoWhite)"/>
  <path d="M 32 26 Q 44 24 40 38 Z" fill="#ea580c"/>

  <!-- Eyes -->
  <ellipse cx="42" cy="32" rx="4" ry="5" fill="#059669"/>
  <circle cx="40.5" cy="30" r="1.5" fill="#ffffff"/>
  <ellipse cx="58" cy="32" rx="4" ry="5" fill="#059669"/>
  <circle cx="56.5" cy="30" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="50,37 48,35 52,35" fill="#f43f5e"/>
</svg>
