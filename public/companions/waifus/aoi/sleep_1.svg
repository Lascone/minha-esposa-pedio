<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aoiSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffbfa"/>
      <stop offset="100%" stop-color="#ffe8e6"/>
    </radialGradient>
    <linearGradient id="aoiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="aoiDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Hair Spread as cushion -->
  <ellipse cx="48" cy="65" rx="36" ry="24" fill="url(#aoiHair)"/>

  <!-- Sleeping Body curled -->
  <ellipse cx="50" cy="72" rx="28" ry="16" fill="url(#aoiDress)"/>
  <ellipse cx="48" cy="72" rx="18" ry="10" fill="#ffffff"/>
  
  <!-- Feet tucked in -->
  <ellipse cx="72" cy="76" rx="5" ry="4" fill="#0f172a"/>

  <!-- Head resting sideways -->
  <ellipse cx="38" cy="55" rx="22" ry="19" fill="url(#aoiSkin)"/>
  <ellipse cx="28" cy="60" rx="4" ry="2.5" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="48" cy="60" rx="4" ry="2.5" fill="#f43f5e" opacity="0.45"/>

  <!-- Sleeping Closed Eyes -->
  <path d="M 26 54 Q 31 58 36 54" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 54 Q 49 58 54 54" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cat ears on headband -->
  <polygon points="26,38 20,28 32,34" fill="#3b82f6"/>
  <polygon points="46,38 54,28 48,40" fill="#3b82f6"/>

  <!-- Floating zZz bubbles -->
  <text x="68" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#60a5fa" opacity="0.85">z</text>
  <text x="76" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" opacity="0.9">Z</text>
  <text x="86" y="16" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#1d4ed8">Z</text>
</svg>
