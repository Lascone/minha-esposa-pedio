<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aoiSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffbfa"/>
      <stop offset="100%" stop-color="#ffe8e6"/>
    </radialGradient>
    <linearGradient id="aoiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="aoiDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Hair Spread on floor -->
  <path d="M 20 44 C 8 58 12 88 28 92 C 36 82 34 68 34 58 Z" fill="url(#aoiHair)"/>
  <path d="M 80 44 C 92 58 88 88 72 92 C 64 82 66 68 66 58 Z" fill="url(#aoiHair)"/>

  <!-- Sitting Dress spread -->
  <ellipse cx="50" cy="84" rx="26" ry="10" fill="url(#aoiDress)"/>
  <ellipse cx="50" cy="83" rx="18" ry="7" fill="#ffffff"/>

  <!-- Feet in front -->
  <ellipse cx="44" cy="88" rx="5" ry="3.5" fill="#0f172a"/>
  <ellipse cx="56" cy="88" rx="5" ry="3.5" fill="#0f172a"/>

  <!-- Hands on lap -->
  <circle cx="44" cy="74" r="4" fill="url(#aoiSkin)"/>
  <circle cx="56" cy="74" r="4" fill="url(#aoiSkin)"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="24" ry="22" fill="url(#aoiSkin)"/>
  <ellipse cx="36" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="64" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.45"/>

  <!-- Relaxed eyes -->
  <ellipse cx="39" cy="44" rx="4.5" ry="5.5" fill="#1e3a8a"/>
  <circle cx="37.5" cy="42" r="2" fill="#ffffff"/>
  <ellipse cx="61" cy="44" rx="4.5" ry="5.5" fill="#1e3a8a"/>
  <circle cx="59.5" cy="42" r="2" fill="#ffffff"/>

  <path d="M 48 50 Q 50 53 52 50" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hair Bangs -->
  <path d="M 26 42 C 26 24 74 24 74 42 C 68 34 58 41 50 34 C 42 41 32 34 26 42 Z" fill="url(#aoiHair)"/>

  <!-- Headband with Cat Ears -->
  <path d="M 32 30 Q 50 22 68 30" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <polygon points="34,28 28,16 42,22" fill="#3b82f6"/>
  <polygon points="66,28 72,16 58,22" fill="#3b82f6"/>
</svg>
