<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aoiSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffbfa"/>
      <stop offset="100%" stop-color="#ffe8e6"/>
    </radialGradient>
    <linearGradient id="aoiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="aoiDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Hair Back Twintails stepping -->
  <path d="M 22 34 C 8 46 10 78 18 82 C 26 72 30 58 30 48 Z" fill="url(#aoiHair)"/>
  <path d="M 72 34 C 84 46 88 78 82 82 C 76 72 70 58 70 48 Z" fill="url(#aoiHair)"/>

  <!-- Maid Dress & Apron -->
  <path d="M 38 54 L 62 54 L 70 80 L 30 80 Z" fill="url(#aoiDress)"/>
  <path d="M 42 56 L 58 56 L 64 80 L 36 80 Z" fill="#ffffff"/>

  <!-- Left foot forward, right back -->
  <ellipse cx="36" cy="85" rx="6" ry="4" fill="#0f172a" transform="rotate(-15 36 85)"/>
  <ellipse cx="62" cy="81" rx="5" ry="3.5" fill="#0f172a" transform="rotate(20 62 81)"/>

  <!-- Arms swinging with serving tray / hand out -->
  <path d="M 35 56 Q 24 64 28 72" fill="none" stroke="url(#aoiSkin)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 63 56 Q 70 64 74 70" fill="none" stroke="url(#aoiSkin)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="49" cy="37" rx="24" ry="22" fill="url(#aoiSkin)"/>
  <ellipse cx="35" cy="43" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="63" cy="43" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="38" cy="37" rx="4.5" ry="6" fill="#1e3a8a"/>
  <circle cx="36.5" cy="35" r="2" fill="#ffffff"/>
  <ellipse cx="60" cy="37" rx="4.5" ry="6" fill="#1e3a8a"/>
  <circle cx="58.5" cy="35" r="2" fill="#ffffff"/>

  <!-- Open happy mouth -->
  <path d="M 47 43 Q 49 48 52 44" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>

  <!-- Hair Bangs -->
  <path d="M 25 35 C 25 17 73 17 73 35 C 67 27 57 34 49 27 C 41 34 31 27 25 35 Z" fill="url(#aoiHair)"/>

  <!-- Headband with Cat Ears -->
  <path d="M 31 23 Q 49 15 67 23" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <polygon points="33,21 27,9 41,15" fill="#3b82f6"/>
  <polygon points="65,21 71,9 57,15" fill="#3b82f6"/>
</svg>
