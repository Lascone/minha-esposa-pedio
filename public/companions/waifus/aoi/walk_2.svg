<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="aoiSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffbfa"/>
      <stop offset="100%" stop-color="#ffe8e6"/>
    </radialGradient>
    <linearGradient id="aoiHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="aoiDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Hair Back Twintails -->
  <path d="M 28 34 C 14 46 18 78 24 82 C 30 72 34 58 34 48 Z" fill="url(#aoiHair)"/>
  <path d="M 76 34 C 90 46 92 78 86 82 C 80 72 74 58 74 48 Z" fill="url(#aoiHair)"/>

  <!-- Maid Dress & Apron -->
  <path d="M 40 54 L 64 54 L 72 80 L 32 80 Z" fill="url(#aoiDress)"/>
  <path d="M 44 56 L 60 56 L 66 80 L 38 80 Z" fill="#ffffff"/>

  <!-- Right foot forward, left back -->
  <ellipse cx="38" cy="81" rx="5" ry="3.5" fill="#0f172a" transform="rotate(-20 38 81)"/>
  <ellipse cx="64" cy="85" rx="6" ry="4" fill="#0f172a" transform="rotate(15 64 85)"/>

  <!-- Arms swinging -->
  <path d="M 37 56 Q 30 64 26 70" fill="none" stroke="url(#aoiSkin)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 65 56 Q 76 64 72 72" fill="none" stroke="url(#aoiSkin)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="51" cy="37" rx="24" ry="22" fill="url(#aoiSkin)"/>
  <ellipse cx="37" cy="43" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="65" cy="43" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="37" rx="4.5" ry="6" fill="#1e3a8a"/>
  <circle cx="38.5" cy="35" r="2" fill="#ffffff"/>
  <ellipse cx="62" cy="37" rx="4.5" ry="6" fill="#1e3a8a"/>
  <circle cx="60.5" cy="35" r="2" fill="#ffffff"/>

  <!-- Open mouth -->
  <path d="M 49 43 Q 51 48 54 44" fill="#f43f5e" stroke="#be123c" stroke-width="1.5"/>

  <!-- Hair Bangs -->
  <path d="M 27 35 C 27 17 75 17 75 35 C 69 27 59 34 51 27 C 43 34 33 27 27 35 Z" fill="url(#aoiHair)"/>

  <!-- Headband with Cat Ears -->
  <path d="M 33 23 Q 51 15 69 23" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <polygon points="35,21 29,9 43,15" fill="#3b82f6"/>
  <polygon points="67,21 73,9 59,15" fill="#3b82f6"/>
</svg>
