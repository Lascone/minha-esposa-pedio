<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d6d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hair Back swinging -->
  <path d="M 24 35 C 10 48 12 78 20 83 C 28 74 32 60 32 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>
  <path d="M 70 35 C 82 48 86 78 80 83 C 74 74 68 60 68 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>

  <!-- Body & Dress tilted slightly -->
  <path d="M 38 54 L 58 54 L 69 80 L 31 80 Z" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.5"/>
  <path d="M 44 57 L 52 57 L 48 65 Z" fill="#ff4d6d"/>
  
  <!-- Step 1: Left foot forward, right back -->
  <ellipse cx="36" cy="85" rx="6" ry="4" fill="#590d22" transform="rotate(-15 36 85)"/>
  <ellipse cx="62" cy="81" rx="5" ry="3.5" fill="#590d22" transform="rotate(20 62 81)"/>

  <!-- Arms swinging -->
  <path d="M 35 56 Q 24 64 28 72" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 61 56 Q 68 64 72 70" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head with bounce -->
  <ellipse cx="49" cy="37" rx="24" ry="22" fill="url(#sakuraSkin)" filter="url(#sakuraGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="35" cy="43" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>
  <ellipse cx="63" cy="43" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>

  <!-- Anime Eyes -->
  <ellipse cx="38" cy="37" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="36.5" cy="35" r="2" fill="#ffffff"/>
  <circle cx="39.5" cy="40" r="1" fill="#ff758f"/>

  <ellipse cx="60" cy="37" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="58.5" cy="35" r="2" fill="#ffffff"/>
  <circle cx="61.5" cy="40" r="1" fill="#ff758f"/>

  <!-- Mouth cute open -->
  <path d="M 47 43 Q 49 48 52 44" fill="#ff4d6d" stroke="#a4133c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hair Front Bangs -->
  <path d="M 25 35 C 25 17 73 17 73 35 C 67 27 57 34 49 27 C 41 34 31 27 25 35 Z" fill="url(#sakuraHair)"/>
  <path d="M 31 29 Q 37 45 41 41" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 67 29 Q 61 45 57 41" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>

  <!-- Flower Pin -->
  <g transform="translate(63, 21) scale(0.65)">
    <circle cx="10" cy="10" r="4" fill="#fff0f3"/>
    <ellipse cx="10" cy="3" rx="3" ry="4" fill="#ff758f"/>
    <ellipse cx="17" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="3" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <circle cx="10" cy="10" r="2" fill="#ffd166"/>
  </g>
</svg>
