<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d6d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hair Back spread around seat -->
  <path d="M 22 45 C 10 58 14 88 30 92 C 38 82 36 68 36 58 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>
  <path d="M 78 45 C 90 58 86 88 70 92 C 62 82 64 68 64 58 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>

  <!-- Sitting Dress Spread -->
  <ellipse cx="50" cy="84" rx="26" ry="10" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.5"/>
  <path d="M 40 60 L 60 60 L 66 84 L 34 84 Z" fill="url(#sakuraDress)"/>
  <path d="M 46 62 L 54 62 L 50 69 Z" fill="#ff4d6d"/>
  
  <!-- Feet tucked in front cute -->
  <ellipse cx="44" cy="88" rx="5" ry="3.5" fill="#590d22"/>
  <ellipse cx="56" cy="88" rx="5" ry="3.5" fill="#590d22"/>

  <!-- Arms resting on knees -->
  <path d="M 37 62 Q 32 74 42 78" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 63 62 Q 68 74 58 78" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head Lowered into cute sitting pose -->
  <ellipse cx="50" cy="44" rx="24" ry="22" fill="url(#sakuraSkin)" filter="url(#sakuraGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="36" cy="50" rx="5" ry="3" fill="#ff4d6d" opacity="0.45"/>
  <ellipse cx="64" cy="50" rx="5" ry="3" fill="#ff4d6d" opacity="0.45"/>

  <!-- Anime Eyes Content & Relaxed -->
  <ellipse cx="39" cy="44" rx="4.5" ry="5.5" fill="#4a0e2e"/>
  <circle cx="37.5" cy="42" r="2" fill="#ffffff"/>
  <circle cx="40.5" cy="46" r="1" fill="#ff758f"/>

  <ellipse cx="61" cy="44" rx="4.5" ry="5.5" fill="#4a0e2e"/>
  <circle cx="59.5" cy="42" r="2" fill="#ffffff"/>
  <circle cx="62.5" cy="46" r="1" fill="#ff758f"/>

  <!-- Mouth gentle smile -->
  <path d="M 48 50 Q 50 53 52 50" fill="none" stroke="#a4133c" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hair Front Bangs -->
  <path d="M 26 42 C 26 24 74 24 74 42 C 68 34 58 41 50 34 C 42 41 32 34 26 42 Z" fill="url(#sakuraHair)"/>

  <!-- Flower Pin -->
  <g transform="translate(64, 28) scale(0.65)">
    <circle cx="10" cy="10" r="4" fill="#fff0f3"/>
    <ellipse cx="10" cy="3" rx="3" ry="4" fill="#ff758f"/>
    <ellipse cx="17" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="3" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <circle cx="10" cy="10" r="2" fill="#ffd166"/>
  </g>
</svg>
