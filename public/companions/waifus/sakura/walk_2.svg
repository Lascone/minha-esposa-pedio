<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d6d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hair Back swinging opposite -->
  <path d="M 28 35 C 16 48 20 78 26 83 C 32 74 36 60 36 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>
  <path d="M 74 35 C 88 48 90 78 84 83 C 78 74 72 60 72 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>

  <!-- Body & Dress -->
  <path d="M 40 54 L 60 54 L 71 80 L 33 80 Z" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.5"/>
  <path d="M 46 57 L 54 57 L 50 65 Z" fill="#ff4d6d"/>
  
  <!-- Step 2: Right foot forward, left back -->
  <ellipse cx="38" cy="81" rx="5" ry="3.5" fill="#590d22" transform="rotate(-20 38 81)"/>
  <ellipse cx="64" cy="85" rx="6" ry="4" fill="#590d22" transform="rotate(15 64 85)"/>

  <!-- Arms swinging opposite -->
  <path d="M 37 56 Q 30 64 26 70" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 63 56 Q 74 64 70 72" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="51" cy="37" rx="24" ry="22" fill="url(#sakuraSkin)" filter="url(#sakuraGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="37" cy="43" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>
  <ellipse cx="65" cy="43" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>

  <!-- Anime Eyes -->
  <ellipse cx="40" cy="37" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="38.5" cy="35" r="2" fill="#ffffff"/>
  <circle cx="41.5" cy="40" r="1" fill="#ff758f"/>

  <ellipse cx="62" cy="37" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="60.5" cy="35" r="2" fill="#ffffff"/>
  <circle cx="63.5" cy="40" r="1" fill="#ff758f"/>

  <!-- Mouth -->
  <path d="M 49 43 Q 51 48 54 44" fill="#ff4d6d" stroke="#a4133c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hair Front Bangs -->
  <path d="M 27 35 C 27 17 75 17 75 35 C 69 27 59 34 51 27 C 43 34 33 27 27 35 Z" fill="url(#sakuraHair)"/>
  <path d="M 33 29 Q 39 45 43 41" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 69 29 Q 63 45 59 41" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>

  <!-- Flower Pin -->
  <g transform="translate(65, 21) scale(0.65)">
    <circle cx="10" cy="10" r="4" fill="#fff0f3"/>
    <ellipse cx="10" cy="3" rx="3" ry="4" fill="#ff758f"/>
    <ellipse cx="17" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="3" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <circle cx="10" cy="10" r="2" fill="#ffd166"/>
  </g>
</svg>
