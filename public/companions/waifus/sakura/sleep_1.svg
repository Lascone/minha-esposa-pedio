<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
  </defs>

  <!-- Hair Spread as cushion -->
  <ellipse cx="48" cy="65" rx="36" ry="24" fill="url(#sakuraHair)"/>

  <!-- Sleeping Body curled -->
  <ellipse cx="50" cy="72" rx="28" ry="16" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.2"/>
  
  <!-- Feet tucked in -->
  <ellipse cx="72" cy="76" rx="5" ry="4" fill="#590d22"/>

  <!-- Cute arms hugging pillow/sleeves -->
  <ellipse cx="44" cy="72" rx="10" ry="6" fill="url(#sakuraSkin)"/>

  <!-- Head resting sideways -->
  <ellipse cx="38" cy="55" rx="22" ry="19" fill="url(#sakuraSkin)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="28" cy="60" rx="4" ry="2.5" fill="#ff4d6d" opacity="0.45"/>
  <ellipse cx="48" cy="60" rx="4" ry="2.5" fill="#ff4d6d" opacity="0.45"/>

  <!-- Sleeping Closed Eyes (Arched lines) -->
  <path d="M 26 54 Q 31 58 36 54" fill="none" stroke="#4a0e2e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 44 54 Q 49 58 54 54" fill="none" stroke="#4a0e2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Peaceful breathing mouth -->
  <circle cx="39" cy="61" r="1.5" fill="#a4133c"/>

  <!-- Flower pin in hair -->
  <circle cx="56" cy="44" r="5" fill="#ff758f"/>
  <circle cx="56" cy="44" r="2" fill="#ffd166"/>

  <!-- Floating zZz text bubbles -->
  <text x="68" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ff4d6d" opacity="0.85">z</text>
  <text x="76" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ff758f" opacity="0.9">Z</text>
  <text x="86" y="16" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ff4d6d">Z</text>
</svg>
