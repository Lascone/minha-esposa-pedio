<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d6d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hair Back slight sway -->
  <path d="M 28 36 C 14 49 19 82 27 87 C 34 77 36 61 36 51 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>
  <path d="M 72 36 C 86 49 81 82 73 87 C 66 77 64 61 64 51 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>

  <!-- Body & Dress -->
  <path d="M 40 56 L 60 56 L 68 83 L 32 83 Z" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.5"/>
  <path d="M 46 59 L 54 59 L 50 67 Z" fill="#ff4d6d"/>
  
  <!-- Feet -->
  <ellipse cx="42" cy="86" rx="5" ry="4" fill="#590d22"/>
  <ellipse cx="58" cy="86" rx="5" ry="4" fill="#590d22"/>

  <!-- Arms -->
  <path d="M 37 58 Q 30 66 39 71" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 63 58 Q 70 66 61 71" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head (gentle breath down 1px) -->
  <ellipse cx="50" cy="39" rx="24" ry="22" fill="url(#sakuraSkin)" filter="url(#sakuraGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="36" cy="45" rx="5" ry="3" fill="#ff4d6d" opacity="0.45"/>
  <ellipse cx="64" cy="45" rx="5" ry="3" fill="#ff4d6d" opacity="0.45"/>

  <!-- Anime Eyes (Cute Smiling Wink / Blink) -->
  <path d="M 35 39 Q 39 35 43 39" fill="none" stroke="#4a0e2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 57 39 Q 61 35 65 39" fill="none" stroke="#4a0e2e" stroke-width="3" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M 48 45 Q 50 49 52 45" fill="none" stroke="#a4133c" stroke-width="2" stroke-linecap="round"/>

  <!-- Hair Front Bangs -->
  <path d="M 26 37 C 26 19 74 19 74 37 C 68 29 58 36 50 29 C 42 36 32 29 26 37 Z" fill="url(#sakuraHair)"/>
  <path d="M 32 31 Q 38 47 42 43" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 68 31 Q 62 47 58 43" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cherry Blossom Hair Pin -->
  <g transform="translate(64, 23) scale(0.65)">
    <circle cx="10" cy="10" r="4" fill="#fff0f3"/>
    <ellipse cx="10" cy="3" rx="3" ry="4" fill="#ff758f"/>
    <ellipse cx="17" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="3" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <circle cx="10" cy="10" r="2" fill="#ffd166"/>
  </g>
</svg>
