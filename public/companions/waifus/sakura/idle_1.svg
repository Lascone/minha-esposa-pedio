<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe3e3"/>
    </radialGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <linearGradient id="sakuraDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffccd5"/>
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d6d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hair Back -->
  <path d="M 28 35 C 15 48 18 80 25 85 C 32 75 35 60 35 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>
  <path d="M 72 35 C 85 48 82 80 75 85 C 68 75 65 60 65 50 Z" fill="url(#sakuraHair)" filter="url(#sakuraGlow)"/>

  <!-- Body & Dress -->
  <path d="M 40 55 L 60 55 L 68 82 L 32 82 Z" fill="url(#sakuraDress)" stroke="#ff758f" stroke-width="1.5"/>
  <path d="M 46 58 L 54 58 L 50 66 Z" fill="#ff4d6d"/>
  
  <!-- Feet -->
  <ellipse cx="42" cy="85" rx="5" ry="4" fill="#590d22"/>
  <ellipse cx="58" cy="85" rx="5" ry="4" fill="#590d22"/>

  <!-- Arms -->
  <path d="M 37 57 Q 30 65 38 70" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 63 57 Q 70 65 62 70" fill="none" stroke="url(#sakuraSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="50" cy="38" rx="24" ry="22" fill="url(#sakuraSkin)" filter="url(#sakuraGlow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="36" cy="44" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>
  <ellipse cx="64" cy="44" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.4"/>

  <!-- Anime Eyes (Sparkling Big Eyes) -->
  <ellipse cx="39" cy="38" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="37.5" cy="36" r="2" fill="#ffffff"/>
  <circle cx="40.5" cy="41" r="1" fill="#ff758f"/>

  <ellipse cx="61" cy="38" rx="4.5" ry="6" fill="#4a0e2e"/>
  <circle cx="59.5" cy="36" r="2" fill="#ffffff"/>
  <circle cx="62.5" cy="41" r="1" fill="#ff758f"/>

  <!-- Mouth -->
  <path d="M 48 44 Q 50 47 52 44" fill="none" stroke="#a4133c" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hair Front Bangs -->
  <path d="M 26 36 C 26 18 74 18 74 36 C 68 28 58 35 50 28 C 42 35 32 28 26 36 Z" fill="url(#sakuraHair)"/>
  <path d="M 32 30 Q 38 46 42 42" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 68 30 Q 62 46 58 42" fill="none" stroke="url(#sakuraHair)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cherry Blossom Hair Pin -->
  <g transform="translate(64, 22) scale(0.65)">
    <circle cx="10" cy="10" r="4" fill="#fff0f3"/>
    <ellipse cx="10" cy="3" rx="3" ry="4" fill="#ff758f"/>
    <ellipse cx="17" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="15" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="5" cy="16" rx="4" ry="3" fill="#ff758f"/>
    <ellipse cx="3" cy="8" rx="4" ry="3" fill="#ff758f"/>
    <circle cx="10" cy="10" r="2" fill="#ffd166"/>
  </g>
</svg>
