<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="slimeGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="90%" stop-color="#059669"/>
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hop airborne shadow smaller -->
  <ellipse cx="50" cy="90" rx="18" ry="4" fill="#064e3b" opacity="0.15"/>

  <!-- Slime Body Stretched in mid-jump / hop! -->
  <path d="M 50 15 C 68 15 76 42 74 65 C 72 78 64 80 50 80 C 36 80 28 78 26 65 C 24 42 32 15 50 15 Z" fill="url(#slimeGrad)" filter="url(#slimeGlow)"/>

  <!-- Highlights -->
  <ellipse cx="40" cy="30" rx="6" ry="12" fill="#ffffff" opacity="0.65" transform="rotate(-15 40 30)"/>
  <circle cx="36" cy="50" r="3" fill="#ffffff" opacity="0.5"/>

  <!-- Happy Jumping Eyes -->
  <ellipse cx="42" cy="46" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="40.5" cy="44" r="1.8" fill="#ffffff"/>
  <ellipse cx="58" cy="46" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="56.5" cy="44" r="1.8" fill="#ffffff"/>

  <!-- Cheeks Blush -->
  <ellipse cx="34" cy="54" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>
  <ellipse cx="66" cy="54" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>

  <!-- Open happy mouth -->
  <path d="M 48 54 Q 50 59 52 54" fill="#ec4899" stroke="#064e3b" stroke-width="1.5"/>
</svg>
