<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="slimeGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="90%" stop-color="#059669"/>
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="85" rx="30" ry="7" fill="#064e3b" opacity="0.2"/>

  <!-- Slime Body -->
  <path d="M 50 25 C 72 25 84 52 82 72 C 80 84 70 85 50 85 C 30 85 20 84 18 72 C 16 52 28 25 50 25 Z" fill="url(#slimeGrad)" filter="url(#slimeGlow)"/>

  <!-- Jelly Gloss Highlights -->
  <ellipse cx="38" cy="38" rx="8" ry="12" fill="#ffffff" opacity="0.65" transform="rotate(-25 38 38)"/>
  <circle cx="34" cy="56" r="3.5" fill="#ffffff" opacity="0.5"/>

  <!-- Cute Big Sparkly Eyes -->
  <ellipse cx="42" cy="56" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="40.5" cy="54" r="1.8" fill="#ffffff"/>
  <circle cx="43" cy="58" r="0.8" fill="#a7f3d0"/>

  <ellipse cx="58" cy="56" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="56.5" cy="54" r="1.8" fill="#ffffff"/>
  <circle cx="59" cy="58" r="0.8" fill="#a7f3d0"/>

  <!-- Cheeks Blush -->
  <ellipse cx="34" cy="64" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>
  <ellipse cx="66" cy="64" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>

  <!-- Cute 'w' Mouth -->
  <path d="M 48 64 Q 50 67 52 64" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
