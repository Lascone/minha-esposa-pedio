  </defs>

  <!-- Sparkles and Hearts! -->
  <path d="M 20 22 A 4 4 0 0 0 12 26 Q 12 32 20 38 Q 28 32 28 26 A 4 4 0 0 0 20 22 Z" fill="#ec4899" transform="rotate(-15 20 27)"/>
