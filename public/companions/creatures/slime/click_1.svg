  <polygon points="76,46 78,42 82,44 78,46 76,50 74,46 70,44 74,42" fill="#fbbf24"/>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="85" rx="32" ry="7" fill="#064e3b" opacity="0.2"/>

