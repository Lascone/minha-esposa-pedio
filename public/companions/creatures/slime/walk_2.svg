<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="slimeGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="90%" stop-color="#059669"/>
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground shadow wide landing -->
  <ellipse cx="50" cy="87" rx="36" ry="8" fill="#064e3b" opacity="0.25"/>

  <!-- Slime Body Squashed on impact -->
  <path d="M 50 38 C 78 38 90 60 88 80 C 86 88 74 88 50 88 C 26 88 14 88 12 80 C 10 60 22 38 50 38 Z" fill="url(#slimeGrad)" filter="url(#slimeGlow)"/>

  <!-- Highlights -->
  <ellipse cx="38" cy="50" rx="9" ry="8" fill="#ffffff" opacity="0.65"/>
  <circle cx="32" cy="66" r="3.5" fill="#ffffff" opacity="0.5"/>

  <!-- Happy eyes -->
  <ellipse cx="42" cy="62" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="40.5" cy="60" r="1.8" fill="#ffffff"/>
  <ellipse cx="58" cy="62" rx="4" ry="5.5" fill="#064e3b"/>
  <circle cx="56.5" cy="60" r="1.8" fill="#ffffff"/>

  <!-- Cheeks Blush -->
  <ellipse cx="34" cy="70" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>
  <ellipse cx="66" cy="70" rx="4" ry="2.2" fill="#ec4899" opacity="0.45"/>

  <!-- Mouth -->
  <path d="M 48 70 Q 50 73 52 70" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
