<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="slimeGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="90%" stop-color="#059669"/>
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Puddle shadow -->
  <ellipse cx="50" cy="88" rx="40" ry="8" fill="#064e3b" opacity="0.25"/>

  <!-- Slime Puddle (Sit / Melted Jelly) -->
  <ellipse cx="50" cy="78" rx="40" ry="14" fill="url(#slimeGrad)" filter="url(#slimeGlow)"/>

  <!-- Highlights -->
  <ellipse cx="36" cy="74" rx="10" ry="4" fill="#ffffff" opacity="0.65"/>
  <circle cx="68" cy="76" r="3" fill="#ffffff" opacity="0.5"/>

  <!-- Cozy Content Eyes -->
  <path d="M 38 74 Q 42 70 46 74" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 54 74 Q 58 70 62 74" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="32" cy="77" rx="3.5" ry="1.8" fill="#ec4899" opacity="0.5"/>
  <ellipse cx="68" cy="77" rx="3.5" ry="1.8" fill="#ec4899" opacity="0.5"/>

  <!-- Little smile -->
  <path d="M 48 76 Q 50 78 52 76" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
