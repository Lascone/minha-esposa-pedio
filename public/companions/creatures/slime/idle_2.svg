<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="slimeGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="90%" stop-color="#059669"/>
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground shadow wider -->
  <ellipse cx="50" cy="86" rx="34" ry="8" fill="#064e3b" opacity="0.22"/>

  <!-- Slime Body Squished slightly -->
  <path d="M 50 32 C 75 32 87 56 85 75 C 83 86 72 87 50 87 C 28 87 17 86 15 75 C 13 56 25 32 50 32 Z" fill="url(#slimeGrad)" filter="url(#slimeGlow)"/>

  <!-- Jelly Gloss Highlights -->
  <ellipse cx="38" cy="44" rx="8" ry="10" fill="#ffffff" opacity="0.65" transform="rotate(-25 38 44)"/>
  <circle cx="33" cy="60" r="3.5" fill="#ffffff" opacity="0.5"/>

  <!-- Happy Squint Eyes (Blink) -->
  <path d="M 38 60 Q 42 56 46 60" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 54 60 Q 58 56 62 60" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="34" cy="66" rx="4.5" ry="2.5" fill="#ec4899" opacity="0.5"/>
  <ellipse cx="66" cy="66" rx="4.5" ry="2.5" fill="#ec4899" opacity="0.5"/>

  <!-- Cute Mouth -->
  <path d="M 48 66 Q 50 69 52 66" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
