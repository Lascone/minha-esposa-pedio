<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="frogSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
  </defs>

  <!-- Love Hearts and Raindrops -->
  <path d="M 22 22 A 4 4 0 0 0 14 26 Q 14 32 22 38 Q 30 32 30 26 A 4 4 0 0 0 22 22 Z" fill="#22c55e" transform="rotate(-15 22 27)"/>
  <path d="M 78 18 A 5 5 0 0 0 68 23 Q 68 30 78 37 Q 88 30 88 23 A 5 5 0 0 0 78 18 Z" fill="#38bdf8" transform="rotate(15 78 24)"/>

  <!-- Water lily leaf -->
  <ellipse cx="50" cy="84" rx="34" ry="8" fill="#15803d" opacity="0.6"/>

  <!-- Frog body -->
  <ellipse cx="50" cy="62" rx="24" ry="20" fill="url(#frogSkin)"/>
  <ellipse cx="50" cy="66" rx="15" ry="13" fill="#dcfce7"/>

  <!-- Eyes happy arcs -->
  <circle cx="34" cy="34" r="12" fill="url(#frogSkin)"/>
  <path d="M 28 34 Q 34 28 40 34" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/>

  <circle cx="66" cy="34" r="12" fill="url(#frogSkin)"/>
  <path d="M 60 34 Q 66 28 72 34" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="30" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="70" cy="50" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>

  <!-- Big singing 'croak' open mouth with pink throat -->
  <ellipse cx="50" cy="52" rx="8" ry="7" fill="#f43f5e" stroke="#14532d" stroke-width="2"/>
</svg>
