<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="frogSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
  </defs>

  <!-- Water lily leaf under frog -->
  <ellipse cx="50" cy="84" rx="34" ry="8" fill="#15803d" opacity="0.6"/>

  <!-- Frog back legs sitting -->
  <ellipse cx="28" cy="74" rx="10" ry="7" fill="url(#frogSkin)"/>
  <ellipse cx="72" cy="74" rx="10" ry="7" fill="url(#frogSkin)"/>

  <!-- Round chubby body -->
  <ellipse cx="50" cy="62" rx="24" ry="20" fill="url(#frogSkin)"/>
  <ellipse cx="50" cy="66" rx="15" ry="13" fill="#dcfce7"/>

  <!-- Front tiny webbed feet -->
  <ellipse cx="42" cy="78" rx="4" ry="4" fill="url(#frogSkin)"/>
  <ellipse cx="58" cy="78" rx="4" ry="4" fill="url(#frogSkin)"/>

  <!-- Giant big frog eyes on top -->
  <circle cx="34" cy="34" r="12" fill="url(#frogSkin)"/>
  <circle cx="34" cy="34" r="7" fill="#052e16"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>

  <circle cx="66" cy="34" r="12" fill="url(#frogSkin)"/>
  <circle cx="66" cy="34" r="7" fill="#052e16"/>
  <circle cx="64" cy="32" r="2.5" fill="#ffffff"/>

  <!-- Cheeks Blush -->
  <ellipse cx="32" cy="50" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="68" cy="50" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.45"/>

  <!-- Wide happy frog smile -->
  <path d="M 38 48 Q 50 58 62 48" fill="none" stroke="#14532d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
