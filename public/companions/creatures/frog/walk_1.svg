<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="frogSkin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="88" rx="20" ry="5" fill="#15803d" opacity="0.3"/>

  <!-- Frog leaping mid-air! -->
  <!-- Stretched back legs kicking -->
  <path d="M 32 60 Q 20 74 16 88" fill="none" stroke="url(#frogSkin)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 68 60 Q 80 74 84 88" fill="none" stroke="url(#frogSkin)" stroke-width="7" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="50" cy="50" rx="22" ry="18" fill="url(#frogSkin)"/>
  <ellipse cx="50" cy="53" rx="14" ry="11" fill="#dcfce7"/>

  <!-- Front arms reaching -->
  <path d="M 38 48 Q 28 38 24 32" fill="none" stroke="url(#frogSkin)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 62 48 Q 72 38 76 32" fill="none" stroke="url(#frogSkin)" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="36" cy="28" r="10" fill="url(#frogSkin)"/>
  <circle cx="36" cy="28" r="6" fill="#052e16"/>
  <circle cx="34" cy="26" r="2" fill="#ffffff"/>

  <circle cx="64" cy="28" r="10" fill="url(#frogSkin)"/>
  <circle cx="64" cy="28" r="6" fill="#052e16"/>
  <circle cx="62" cy="26" r="2" fill="#ffffff"/>

  <!-- Wide happy mouth -->
  <path d="M 40 40 Q 50 48 60 40" fill="none" stroke="#14532d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
