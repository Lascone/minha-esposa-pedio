<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shibaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="shibaWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
  </defs>

  <!-- Tail curled around body -->
  <path d="M 28 72 Q 18 50 32 46 Q 38 52 32 72" fill="url(#shibaFur)"/>
  <circle cx="28" cy="48" r="4" fill="url(#shibaWhite)"/>

  <!-- Sitting Hind Paws -->
  <ellipse cx="34" cy="80" rx="9" ry="6" fill="url(#shibaFur)"/>
  <ellipse cx="68" cy="80" rx="9" ry="6" fill="url(#shibaFur)"/>

  <!-- Body sitting straight -->
  <ellipse cx="51" cy="62" rx="18" ry="19" fill="url(#shibaFur)"/>
  <ellipse cx="51" cy="64" rx="12" ry="14" fill="url(#shibaWhite)"/>

  <!-- Front Paws together -->
  <ellipse cx="45" cy="82" rx="4.5" ry="5" fill="url(#shibaWhite)"/>
  <ellipse cx="57" cy="82" rx="4.5" ry="5" fill="url(#shibaWhite)"/>

  <!-- Red Collar with Bell -->
  <path d="M 42 46 Q 51 50 60 46" fill="none" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
  <circle cx="51" cy="51" r="3.5" fill="#ffd166"/>

  <!-- Ears perked -->
  <polygon points="34,16 26,34 44,30" fill="url(#shibaFur)"/>
  <polygon points="33,19 28,32 40,29" fill="#ffccd5"/>
  <polygon points="68,16 76,34 58,30" fill="url(#shibaFur)"/>
  <polygon points="69,19 74,32 62,29" fill="#ffccd5"/>

  <!-- Head -->
  <ellipse cx="51" cy="34" rx="19" ry="16" fill="url(#shibaFur)"/>
  <path d="M 36 34 Q 51 44 66 34 Q 68 46 51 47 Q 34 46 36 34 Z" fill="url(#shibaWhite)"/>
  <ellipse cx="38" cy="38" rx="3.5" ry="2" fill="#ff4d6d" opacity="0.35"/>
  <ellipse cx="64" cy="38" rx="3.5" ry="2" fill="#ff4d6d" opacity="0.35"/>

  <!-- Eyes Sparkle Happy -->
  <ellipse cx="43" cy="32" rx="2.5" ry="3.5" fill="#2b2d42"/>
  <circle cx="42" cy="31" r="1.2" fill="#ffffff"/>
  <ellipse cx="59" cy="32" rx="2.5" ry="3.5" fill="#2b2d42"/>
  <circle cx="58" cy="31" r="1.2" fill="#ffffff"/>

  <!-- Nose & Tongue -->
  <ellipse cx="51" cy="38" rx="2" ry="1.5" fill="#2b2d42"/>
  <ellipse cx="51" cy="43" rx="2.5" ry="2" fill="#ff4d6d"/>
</svg>
