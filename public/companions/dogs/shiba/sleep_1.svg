<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shibaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="shibaWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
  </defs>

  <!-- Curled up dog loaf -->
  <ellipse cx="48" cy="68" rx="34" ry="20" fill="url(#shibaFur)"/>
  
  <!-- Curled Tail over body -->
  <path d="M 76 68 Q 84 52 72 48 Q 66 54 72 68" fill="url(#shibaFur)"/>
  <circle cx="70" cy="50" r="4" fill="url(#shibaWhite)"/>

  <!-- Paws tucked -->
  <ellipse cx="28" cy="78" rx="5" ry="3.5" fill="url(#shibaWhite)"/>
  <ellipse cx="38" cy="78" rx="5" ry="3.5" fill="url(#shibaWhite)"/>

  <!-- Head resting on paws -->
  <ellipse cx="32" cy="58" rx="18" ry="14" fill="url(#shibaFur)"/>
  <ellipse cx="28" cy="62" rx="11" ry="8" fill="url(#shibaWhite)"/>

  <!-- Flopped Ears -->
  <polygon points="34,45 42,42 45,54" fill="url(#shibaFur)"/>
  <polygon points="18,48 24,45 23,57" fill="url(#shibaFur)"/>

  <!-- Sleeping Eyes (curved peaceful line) -->
  <path d="M 22 57 Q 26 60 30 57" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="24" cy="63" rx="1.8" ry="1.2" fill="#2b2d42"/>

  <!-- Blush -->
  <ellipse cx="32" cy="63" rx="3" ry="1.8" fill="#ff4d6d" opacity="0.35"/>

  <!-- Floating zZz -->
  <text x="62" y="44" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#f4a261">z</text>
  <text x="70" y="32" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#e76f51">Z</text>
  <text x="80" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#e63946">Z</text>
</svg>
