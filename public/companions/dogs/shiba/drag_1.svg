<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shibaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="shibaWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
  </defs>

  <!-- Dangling Scruff Lift (Cute Puppy Potato Drag) -->
  <!-- Tail hanging down -->
  <path d="M 50 78 Q 45 92 42 96 Q 38 90 46 76" fill="url(#shibaFur)"/>

  <!-- Body stretched -->
  <ellipse cx="50" cy="58" rx="19" ry="24" fill="url(#shibaFur)"/>
  <ellipse cx="50" cy="62" rx="12" ry="16" fill="url(#shibaWhite)"/>

  <!-- Dangling Front Paws -->
  <ellipse cx="36" cy="68" rx="5" ry="7" fill="url(#shibaWhite)"/>
  <ellipse cx="64" cy="68" rx="5" ry="7" fill="url(#shibaWhite)"/>

  <!-- Dangling Back Paws -->
  <ellipse cx="40" cy="84" rx="4.5" ry="6" fill="url(#shibaWhite)"/>
  <ellipse cx="60" cy="84" rx="4.5" ry="6" fill="url(#shibaWhite)"/>

  <!-- Collar -->
  <path d="M 40 40 Q 50 44 60 40" fill="none" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="45" r="3.5" fill="#ffd166"/>

  <!-- Head -->
  <ellipse cx="50" cy="28" rx="18" ry="15" fill="url(#shibaFur)"/>
  <path d="M 36 28 Q 50 38 64 28 Q 66 40 50 41 Q 34 40 36 28 Z" fill="url(#shibaWhite)"/>

  <!-- Big surprised round eyes -->
  <ellipse cx="42" cy="26" rx="3.5" ry="4.5" fill="#2b2d42"/>
  <circle cx="41" cy="24" r="1.5" fill="#ffffff"/>
  <ellipse cx="58" cy="26" rx="3.5" ry="4.5" fill="#2b2d42"/>
  <circle cx="57" cy="24" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows dots -->
  <ellipse cx="42" cy="18" rx="2" ry="1.4" fill="#ffffff"/>
  <ellipse cx="58" cy="18" rx="2" ry="1.4" fill="#ffffff"/>

  <!-- Cute surprised 'o' mouth -->
  <ellipse cx="50" cy="34" rx="2" ry="2.5" fill="#ff4d6d"/>

  <!-- Ears perked -->
  <polygon points="32,10 24,28 42,24" fill="url(#shibaFur)"/>
  <polygon points="68,10 76,28 58,24" fill="url(#shibaFur)"/>
</svg>
