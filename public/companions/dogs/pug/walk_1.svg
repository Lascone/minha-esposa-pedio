<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pugFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
  </defs>

  <!-- Curled cinnamon roll tail -->
  <path d="M 20 54 Q 12 40 20 36 Q 26 40 22 48" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="48" cy="62" rx="23" ry="18" fill="url(#pugFur)"/>
  
  <!-- Walk paws -->
  <ellipse cx="34" cy="80" rx="6" ry="4" fill="#ca8a04" transform="rotate(-15 34 80)"/>
  <ellipse cx="62" cy="78" rx="5" ry="3.5" fill="#ca8a04" transform="rotate(15 62 78)"/>

  <!-- Red collar with bone tag -->
  <path d="M 38 50 Q 48 54 58 50" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="48" cy="54" r="3" fill="#facc15"/>

  <!-- Ears -->
  <polygon points="34,24 22,38 38,34" fill="#451a03"/>
  <polygon points="62,24 74,38 58,34" fill="#451a03"/>

  <!-- Head -->
  <ellipse cx="48" cy="36" rx="20" ry="18" fill="url(#pugFur)"/>
  <ellipse cx="48" cy="40" rx="14" ry="11" fill="#451a03"/>

  <!-- Big round shiny puppy eyes -->
  <ellipse cx="40" cy="34" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="39" cy="32" r="1.5" fill="#ffffff"/>
  <ellipse cx="56" cy="34" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="55" cy="32" r="1.5" fill="#ffffff"/>

  <!-- Happy tongue -->
  <ellipse cx="48" cy="47" rx="3.5" ry="4.5" fill="#f43f5e"/>
</svg>
