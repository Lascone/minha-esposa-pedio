<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pugFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
  </defs>

  <!-- Curled cinnamon roll tail -->
  <path d="M 22 55 Q 14 42 22 38 Q 28 42 24 50" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="48" cy="64" rx="23" ry="18" fill="url(#pugFur)"/>
  
  <ellipse cx="36" cy="80" rx="5" ry="4" fill="#ca8a04"/>
  <ellipse cx="60" cy="80" rx="5" ry="4" fill="#ca8a04"/>

  <!-- Red collar with bone tag -->
  <path d="M 38 52 Q 48 56 58 52" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="48" cy="56" r="3" fill="#facc15"/>

  <!-- Floppy triangular ears -->
  <polygon points="34,26 22,40 38,36" fill="#451a03"/>
  <polygon points="62,26 74,40 58,36" fill="#451a03"/>

  <!-- Head -->
  <ellipse cx="48" cy="38" rx="20" ry="18" fill="url(#pugFur)"/>

  <!-- Black pug snout mask -->
  <ellipse cx="48" cy="42" rx="14" ry="11" fill="#451a03"/>
  <ellipse cx="48" cy="44" rx="7" ry="5" fill="#1c1917"/>

  <!-- Wrinkles on forehead -->
  <path d="M 44 28 Q 48 30 52 28" fill="none" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 42 32 Q 48 34 54 32" fill="none" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Big round shiny puppy eyes -->
  <ellipse cx="40" cy="36" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="39" cy="34" r="1.5" fill="#ffffff"/>
  <ellipse cx="56" cy="36" rx="4" ry="4.5" fill="#1c1917"/>
  <circle cx="55" cy="34" r="1.5" fill="#ffffff"/>

  <!-- Happy pink tongue sticking out! -->
  <ellipse cx="48" cy="49" rx="3.5" ry="4.5" fill="#f43f5e"/>
</svg>
