<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="chickYellow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>
  </defs>

  <!-- Chick tilted in walk -->
  <circle cx="50" cy="54" r="26" fill="url(#chickYellow)"/>

  <!-- Feet walking -->
  <polygon points="36,78 30,86 40,86" fill="#f97316"/>
  <polygon points="64,80 58,88 68,88" fill="#f97316"/>

  <!-- Wings flapping in walk -->
  <ellipse cx="26" cy="50" rx="5" ry="10" fill="#eab308" transform="rotate(-35 26 50)"/>
  <ellipse cx="74" cy="50" rx="5" ry="10" fill="#eab308" transform="rotate(35 74 50)"/>

  <!-- Head tuft -->
  <path d="M 50 28 Q 50 16 54 22 Q 52 14 46 22" fill="#facc15" stroke="#eab308" stroke-width="1.2"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="48" rx="4" ry="5" fill="#451a03"/>
  <circle cx="39" cy="46" r="1.5" fill="#ffffff"/>
  <ellipse cx="60" cy="48" rx="4" ry="5" fill="#451a03"/>
  <circle cx="59" cy="46" r="1.5" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="50,54 44,50 56,50" fill="#f97316"/>
</svg>
