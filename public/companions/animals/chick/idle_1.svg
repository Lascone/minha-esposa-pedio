<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="chickYellow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>
  </defs>

  <!-- Round tiny chick body -->
  <circle cx="50" cy="55" r="26" fill="url(#chickYellow)"/>

  <!-- Orange feet -->
  <polygon points="40,80 34,88 44,88" fill="#f97316"/>
  <polygon points="60,80 54,88 64,88" fill="#f97316"/>

  <!-- Little feather wings -->
  <ellipse cx="28" cy="56" rx="4" ry="9" fill="#eab308" transform="rotate(-15 28 56)"/>
  <ellipse cx="72" cy="56" rx="4" ry="9" fill="#eab308" transform="rotate(15 72 56)"/>

  <!-- Head tuft -->
  <path d="M 50 28 Q 50 16 54 22 Q 52 14 46 22" fill="#facc15" stroke="#eab308" stroke-width="1.2"/>

  <!-- Sparkly chick eyes -->
  <ellipse cx="40" cy="48" rx="4" ry="5" fill="#451a03"/>
  <circle cx="39" cy="46" r="1.5" fill="#ffffff"/>
  <ellipse cx="60" cy="48" rx="4" ry="5" fill="#451a03"/>
  <circle cx="59" cy="46" r="1.5" fill="#ffffff"/>

  <!-- Cheeks Blush -->
  <ellipse cx="32" cy="54" rx="4" ry="2.2" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="68" cy="54" rx="4" ry="2.2" fill="#f43f5e" opacity="0.45"/>

  <!-- Orange triangular beak -->
  <polygon points="50,54 44,50 56,50" fill="#f97316"/>
</svg>
