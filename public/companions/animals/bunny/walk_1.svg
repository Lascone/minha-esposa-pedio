<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bunnyFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
  </defs>

  <!-- Hopping Airborne -->
  <circle cx="22" cy="62" r="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Body tilted in hop -->
  <ellipse cx="48" cy="58" rx="22" ry="17" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(-10 48 58)"/>
  
  <!-- Paws tucked for hop -->
  <ellipse cx="36" cy="74" rx="5" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" transform="rotate(-20 36 74)"/>
  <ellipse cx="62" cy="72" rx="5" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" transform="rotate(20 62 72)"/>

  <!-- Ears trailing behind in wind -->
  <ellipse cx="38" cy="20" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(-25 38 20)"/>
  <ellipse cx="38" cy="20" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(-25 38 20)"/>

  <ellipse cx="52" cy="18" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(-15 52 18)"/>
  <ellipse cx="52" cy="18" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(-15 52 18)"/>

  <!-- Head -->
  <ellipse cx="50" cy="40" rx="20" ry="17" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2"/>
  <ellipse cx="36" cy="44" rx="4" ry="2.2" fill="#ff4d6d" opacity="0.4"/>
  <ellipse cx="64" cy="44" rx="4" ry="2.2" fill="#ff4d6d" opacity="0.4"/>

  <!-- Eyes Sparkle -->
  <ellipse cx="42" cy="38" rx="3.5" ry="5" fill="#be123c"/>
  <circle cx="41" cy="36" r="1.5" fill="#ffffff"/>
  <ellipse cx="58" cy="38" rx="3.5" ry="5" fill="#be123c"/>
  <circle cx="57" cy="36" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="50,43 48,41 52,41" fill="#ff758f"/>
</svg>
