<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bunnyFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
  </defs>

  <!-- Fluffy round tail -->
  <circle cx="24" cy="68" r="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Body -->
  <ellipse cx="48" cy="65" rx="22" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2"/>
  
  <!-- Little paws -->
  <ellipse cx="38" cy="80" rx="5" ry="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <ellipse cx="58" cy="80" rx="5" ry="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Long Bunny Ears -->
  <ellipse cx="42" cy="22" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(-8 42 22)"/>
  <ellipse cx="42" cy="22" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(-8 42 22)"/>

  <ellipse cx="58" cy="22" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(8 58 22)"/>
  <ellipse cx="58" cy="22" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(8 58 22)"/>

  <!-- Head -->
  <ellipse cx="50" cy="46" rx="20" ry="17" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Cheeks Blush -->
  <ellipse cx="36" cy="50" rx="4" ry="2.2" fill="#ff4d6d" opacity="0.4"/>
  <ellipse cx="64" cy="50" rx="4" ry="2.2" fill="#ff4d6d" opacity="0.4"/>

  <!-- Cute big ruby eyes -->
  <ellipse cx="42" cy="44" rx="3.5" ry="5" fill="#be123c"/>
  <circle cx="41" cy="42" r="1.5" fill="#ffffff"/>
  <ellipse cx="58" cy="44" rx="3.5" ry="5" fill="#be123c"/>
  <circle cx="57" cy="42" r="1.5" fill="#ffffff"/>

  <!-- Pink twitchy nose & mouth -->
  <polygon points="50,49 48,47 52,47" fill="#ff758f"/>
  <path d="M 48 51 Q 50 54 52 51" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <path d="M 32 48 L 22 47" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 32 51 L 23 53" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 68 48 L 78 47" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 68 51 L 77 53" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
</svg>
