<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bunnyFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
  </defs>

  <!-- Love Hearts -->
  <path d="M 22 22 A 4 4 0 0 0 14 26 Q 14 32 22 38 Q 30 32 30 26 A 4 4 0 0 0 22 22 Z" fill="#ff4d6d" transform="rotate(-15 22 27)"/>
  <path d="M 78 18 A 5 5 0 0 0 68 23 Q 68 30 78 37 Q 88 30 88 23 A 5 5 0 0 0 78 18 Z" fill="#ff758f" transform="rotate(15 78 24)"/>

  <!-- Body sitting -->
  <ellipse cx="48" cy="66" rx="22" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2"/>
  
  <!-- Ears perked happily -->
  <ellipse cx="42" cy="20" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(-6 42 20)"/>
  <ellipse cx="42" cy="20" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(-6 42 20)"/>
  <ellipse cx="58" cy="20" rx="5" ry="18" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2" transform="rotate(6 58 20)"/>
  <ellipse cx="58" cy="20" rx="2.8" ry="12" fill="#ffccd5" transform="rotate(6 58 20)"/>

  <!-- Head -->
  <ellipse cx="50" cy="44" rx="20" ry="17" fill="url(#bunnyFur)" stroke="#e2e8f0" stroke-width="1.2"/>
  <ellipse cx="36" cy="48" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.5"/>
  <ellipse cx="64" cy="48" rx="4.5" ry="2.5" fill="#ff4d6d" opacity="0.5"/>

  <!-- Happy Eyes -->
  <path d="M 38 42 Q 41 38 44 42" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56 42 Q 59 38 62 42" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Holding Juicy Orange Carrot! -->
  <g transform="translate(42, 54) rotate(-30)">
    <polygon points="10,0 2,24 14,24" fill="#f97316"/>
    <!-- Carrot leaves -->
    <path d="M 10 0 Q 6 -8 2 -6" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 0 Q 10 -10 12 -8" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 0 Q 14 -8 18 -6" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Paws holding carrot -->
  <circle cx="44" cy="62" r="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="56" cy="62" r="3.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
</svg>
