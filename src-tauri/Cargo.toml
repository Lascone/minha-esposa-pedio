[package]
name = "pedi-para-meu-marido"
version = "1.3.23"
description = "Central de utilitários e Crosshair Studio para minha esposa"
authors = ["Marido Apaixonado"]
edition = "2021"

[lib]
name = "pedi_para_meu_marido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.2"
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_NetworkManagement_WiFi",
] }

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.build-override]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
incremental = false

[profile.release.build-override]
codegen-units = 1
incremental = false



